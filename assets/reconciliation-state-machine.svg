<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1060" role="img" aria-labelledby="title desc">
  <title id="title">Reconciliation state machine</title>
  <desc id="desc">A five-stage state machine that observes two ledgers, classifies drift, checks authority, acts only within bounds, and escalates ambiguity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .h { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; text-anchor: middle; }
      .n { font: 500 16px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; text-anchor: middle; }
      .s { font: 400 16px ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; text-anchor: middle; }
      .box { fill: #132337; stroke: #22d3ee; stroke-width: 1.5; rx: 16; }
      .guard { fill: #17302e; stroke: #2dd4bf; }
      .act { fill: #222942; stroke: #818cf8; }
      .stop { fill: #3a242b; stroke: #fb7185; }
      .line { stroke: #67e8f9; stroke-width: 2; marker-end: url(#arrow); }
      .branch { stroke: #fb7185; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect width="390" height="1060" rx="24" fill="#08131f"/>
  <text x="195" y="42" class="h">RECONCILIATION IS AN AUTHORITY CHECK</text>
  <text x="195" y="68" class="s">對帳不是直接覆寫，而是先判斷誰有權改</text>

  <rect x="35" y="98" width="320" height="110" class="box"/>
  <text x="195" y="132" class="n">01 · OBSERVE／觀測</text>
  <text x="195" y="160" class="s">external execution state</text>
  <text x="195" y="184" class="s">local decision ledger</text>
  <line x1="195" y1="212" x2="195" y2="246" class="line"/>

  <rect x="35" y="254" width="320" height="140" class="box"/>
  <text x="195" y="288" class="n">02 · CLASSIFY／分類</text>
  <text x="195" y="318" class="s">exchange-only · local-only</text>
  <text x="195" y="344" class="s">direction mismatch · incomplete exit</text>
  <text x="195" y="370" class="s">lifecycle · quantity · status mismatch</text>
  <line x1="195" y1="398" x2="195" y2="432" class="line"/>

  <rect x="35" y="440" width="320" height="140" class="box guard"/>
  <text x="195" y="474" class="n">03 · AUTHORIZE／授權</text>
  <text x="195" y="504" class="s">kill switch active?</text>
  <text x="195" y="530" class="s">system · manual · unknown owner?</text>
  <text x="195" y="556" class="s">verified evidence present?</text>

  <path d="M 355 510 C 382 510, 382 668, 350 668" class="branch"/>
  <line x1="195" y1="584" x2="195" y2="618" class="line"/>

  <rect x="35" y="626" width="260" height="140" class="box act"/>
  <text x="165" y="660" class="n">04 · ACT／動作</text>
  <text x="165" y="690" class="s">noop · leave untouched</text>
  <text x="165" y="716" class="s">settle local · bounded retry</text>
  <text x="165" y="742" class="s">typed target + authority tier</text>

  <rect x="305" y="626" width="50" height="140" class="box stop"/>
  <text x="330" y="696" class="n" transform="rotate(90 330 696)">ESCALATE</text>

  <line x1="165" y1="770" x2="165" y2="810" class="line"/>
  <rect x="35" y="818" width="320" height="112" class="box"/>
  <text x="195" y="852" class="n">05 · RECORD／留下證據</text>
  <text x="195" y="882" class="s">finding · severity · reason</text>
  <text x="195" y="908" class="s">action · authority · mutation target</text>

  <rect x="35" y="958" width="320" height="78" class="box stop"/>
  <text x="195" y="990" class="n">FAIL CLOSED／保留歧義</text>
  <text x="195" y="1018" class="s">未知 ownership 永不自動修改外部 state</text>
</svg>
